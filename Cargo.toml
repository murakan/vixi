[package]
name = "vixi"
version = "0.1.0"
edition = "2021"
description = "A CPU-based image viewer for JPG, PNG, and TIFF images."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", default-features = true }
tiff = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
