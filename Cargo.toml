[package]
name = "vixi"
version = "0.1.0"
edition = "2021"
description = "A CPU-based, terminal-controlled image viewer with broad format support."
license = "MIT"

[features]
default = ["video"]
# Video playback via the FFmpeg libav* libraries (ffmpeg-next).
# Requires the FFmpeg development libraries at build time. Disable with
# `--no-default-features` to build without video support.
video = ["dep:ffmpeg-next"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.28"
egui = "0.28"
ffmpeg-next = { version = "6.1", optional = true }
image = { version = "0.25", default-features = true }
tiff = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
